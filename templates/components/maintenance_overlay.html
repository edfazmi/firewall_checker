<style>
    .siakaf-maintenance-overlay {
        position: fixed;
        inset: 0;
        z-index: 99990;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: rgba(75, 85, 99, 0.42);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
        pointer-events: auto;
        user-select: none;
    }

    .siakaf-maintenance-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform: translateY(-12px);
    }

    .siakaf-maintenance-stamp {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: min(560px, 78vw);
        height: min(235px, 35vw);
        min-height: 175px;
        box-sizing: border-box;
        border: 6px solid rgba(31, 41, 55, 0.72);
        border-radius: 18px;
        transform: rotate(-7deg);
        opacity: 0.9;
        pointer-events: none;
    }

    .siakaf-maintenance-stamp::before {
        content: "";
        position: absolute;
        inset: 11px;
        border: 2px solid rgba(31, 41, 55, 0.58);
        border-radius: 10px;
    }

    .siakaf-maintenance-stamp::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 18px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3);
    }

    .siakaf-maintenance-corner {
        position: absolute;
        z-index: 2;
        width: 15px;
        height: 15px;
        border: 3px solid rgba(31, 41, 55, 0.65);
    }

    .siakaf-maintenance-corner.top-left {
        top: 22px;
        left: 22px;
        border-right: 0;
        border-bottom: 0;
    }

    .siakaf-maintenance-corner.top-right {
        top: 22px;
        right: 22px;
        border-left: 0;
        border-bottom: 0;
    }

    .siakaf-maintenance-corner.bottom-left {
        bottom: 22px;
        left: 22px;
        border-right: 0;
        border-top: 0;
    }

    .siakaf-maintenance-corner.bottom-right {
        right: 22px;
        bottom: 22px;
        border-left: 0;
        border-top: 0;
    }

    .siakaf-maintenance-top {
        position: relative;
        z-index: 2;
        margin-bottom: 7px;
        padding: 4px 20px;
        border-top: 2px solid rgba(31, 41, 55, 0.65);
        border-bottom: 2px solid rgba(31, 41, 55, 0.65);
        color: rgba(31, 41, 55, 0.82);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.28em;
        text-transform: uppercase;
    }

    .siakaf-maintenance-title {
        position: relative;
        z-index: 2;
        color: rgba(17, 24, 39, 0.92);
        font-size: clamp(34px, 5vw, 62px);
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.08em;
        text-align: center;
    }

    .siakaf-maintenance-bottom {
        position: relative;
        z-index: 2;
        margin-top: 10px;
        color: rgba(31, 41, 55, 0.78);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
    }

    .siakaf-maintenance-exit {
        position: relative;
        z-index: 100000;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 130px;
        margin-top: 30px;
        padding: 10px 24px;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 9px;
        background: rgba(17, 24, 39, 0.94);
        color: white;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-decoration: none;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        transition: all 0.2s ease;
        pointer-events: auto;
        cursor: pointer;
    }

    .siakaf-maintenance-exit:hover {
        background: rgba(31, 41, 55, 1);
        transform: translateY(-2px);
        box-shadow: 0 11px 28px rgba(0, 0, 0, 0.34);
    }

    .siakaf-maintenance-exit:active {
        transform: translateY(0);
    }

    .siakaf-maintenance-exit-icon {
        margin-right: 8px;
        font-size: 15px;
    }

    @media (max-width: 640px) {
        .siakaf-maintenance-content {
            transform: translateY(-8px);
        }

        .siakaf-maintenance-stamp {
            width: 82vw;
            height: 180px;
            min-height: 150px;
            border-width: 4px;
        }

        .siakaf-maintenance-stamp::before {
            inset: 8px;
        }

        .siakaf-maintenance-top {
            font-size: 8px;
            letter-spacing: 0.18em;
        }

        .siakaf-maintenance-title {
            font-size: 29px;
            letter-spacing: 0.05em;
        }

        .siakaf-maintenance-bottom {
            font-size: 8px;
            letter-spacing: 0.1em;
        }

        .siakaf-maintenance-corner {
            width: 11px;
            height: 11px;
            border-width: 2px;
        }

        .siakaf-maintenance-exit {
            min-width: 115px;
            margin-top: 24px;
            padding: 9px 20px;
            font-size: 12px;
        }
    }
</style>

<div class="siakaf-maintenance-overlay" aria-hidden="true">
    <div class="siakaf-maintenance-content">
        <div class="siakaf-maintenance-stamp">
            <span class="siakaf-maintenance-corner top-left"></span>
            <span class="siakaf-maintenance-corner top-right"></span>
            <span class="siakaf-maintenance-corner bottom-left"></span>
            <span class="siakaf-maintenance-corner bottom-right"></span>

            <div class="siakaf-maintenance-top">SIAKAF SYSTEM</div>
            <div class="siakaf-maintenance-title">MAINTENANCE</div>
            <div class="siakaf-maintenance-bottom">HALAMAN SEDANG DALAM PERBAIKAN</div>
        </div>

        <a href="{% url 'compliance:rule_list' %}" class="siakaf-maintenance-exit">
            <span class="siakaf-maintenance-exit-icon">←</span>
            KELUAR
        </a>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const overlay = document.querySelector(".siakaf-maintenance-overlay");
        const exitButton = document.querySelector(".siakaf-maintenance-exit");

        if (!overlay || !exitButton) {
            return;
        }

        const pageElements = document.querySelectorAll(
            "body > *:not(.siakaf-maintenance-overlay)"
        );

        pageElements.forEach(function (element) {
            if (element.contains(overlay)) {
                return;
            }

            element.setAttribute("inert", "");
        });

        exitButton.removeAttribute("inert");
        exitButton.setAttribute("aria-label", "Keluar dari halaman maintenance");
    });
</script>
