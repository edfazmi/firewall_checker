<div class="grid grid-cols-1 md:grid-cols-4 gap-6">
    <div class="md:col-span-3 bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex items-center space-x-5">
        <div class="p-3 bg-slate-50 rounded-lg border border-slate-100">
            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path></svg>
        </div>
        <div>
            <h3 class="text-xl font-semibold text-gray-900 tracking-tight">{{ scan.device.name }}</h3>
            <p class="text-sm text-gray-500 mt-1">{{ scan.device.ip_address }}</p>
        </div>
    </div>

    <div class="md:col-span-1 bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex justify-around items-center">
        <div class="text-center">
            <div class="text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">Total Policy</div>
            <div class="text-3xl font-bold text-gray-900">{{ scan.device.statistics.total_policies|default:"0" }}</div>
        </div>
        <div class="w-px h-12 bg-gray-200 mx-4"></div>
        <div class="text-center">
            <div class="text-xs font-semibold text-red-500 mb-1 uppercase tracking-wider">Temuan</div>
            <div class="text-3xl font-bold text-red-600">{{ findings|length }}</div>
        </div>
    </div>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-wrap justify-between items-center text-center gap-4">
    <div class="flex-1 min-w-[80px]">
        <div class="text-xs font-semibold text-red-600 mb-2 uppercase tracking-wider">Critical</div>
        <div class="text-2xl font-bold text-red-600" id="count-critical">0</div>
    </div>
    <div class="hidden sm:block w-px h-10 bg-gray-200"></div>
    <div class="flex-1 min-w-[80px]">
        <div class="text-xs font-semibold text-orange-500 mb-2 uppercase tracking-wider">High</div>
        <div class="text-2xl font-bold text-orange-500" id="count-high">0</div>
    </div>
    <div class="hidden sm:block w-px h-10 bg-gray-200"></div>
    <div class="flex-1 min-w-[80px]">
        <div class="text-xs font-semibold text-yellow-500 mb-2 uppercase tracking-wider">Medium</div>
        <div class="text-2xl font-bold text-yellow-500" id="count-medium">0</div>
    </div>
    <div class="hidden sm:block w-px h-10 bg-gray-200"></div>
    <div class="flex-1 min-w-[80px]">
        <div class="text-xs font-semibold text-blue-600 mb-2 uppercase tracking-wider">Low</div>
        <div class="text-2xl font-bold text-blue-600" id="count-low">0</div>
    </div>
    <div class="hidden sm:block w-px h-10 bg-gray-200"></div>
    <div class="flex-1 min-w-[80px]">
        <div class="text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wider">Info</div>
        <div class="text-2xl font-bold text-gray-600" id="count-info">0</div>
    </div>
</div>
