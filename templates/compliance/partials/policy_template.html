<template id="policy-detail-template">
    <td colspan="{COLSPAN}" class="px-6 pb-6 pt-2">
        <div class="border border-slate-200 rounded-xl overflow-hidden bg-white shadow-sm relative">
            
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="p-1.5 bg-blue-100 rounded-md text-blue-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <h4 class="font-semibold text-base text-gray-900" id="title-{ID}">Detail Policy</h4>
                </div>
                <button type="button" onclick="closeDetail('{ID}')" class="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-md transition-colors" title="Tutup Detail">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div id="loader-{ID}" class="py-16 text-center">
                <svg class="animate-spin h-8 w-8 text-blue-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <p class="text-sm font-medium text-gray-500 tracking-wide">Menarik data dari perangkat...</p>
            </div>

            <div id="content-{ID}" class="hidden">
                <div class="grid grid-cols-1 lg:grid-cols-5 divide-y lg:divide-y-0 lg:divide-x divide-slate-100 text-sm bg-white">
                    
                    <div class="p-5 space-y-5 min-w-0">
                        <div>
                            <span class="block text-xs uppercase font-semibold text-gray-500 mb-1">Policy ID / Name</span>
                            <span class="block font-semibold text-gray-900 break-words" id="p-id-name-{ID}">-</span>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <span class="block text-xs uppercase font-semibold text-gray-500 mb-1">Status</span>
                                <span id="p-status-{ID}" class="inline-block">-</span>
                            </div>
                            <div>
                                <span class="block text-xs uppercase font-semibold text-gray-500 mb-1">Action</span>
                                <span id="p-action-{ID}" class="block font-semibold">-</span>
                            </div>
                            <div>
                                <span class="block text-xs uppercase font-semibold text-gray-500 mb-1">NAT</span>
                                <span id="p-nat-{ID}" class="block font-medium text-gray-800">-</span>
                            </div>
                            <div>
                                <span class="block text-xs uppercase font-semibold text-gray-500 mb-1">Logging</span>
                                <span id="p-log-{ID}" class="inline-block">-</span>
                            </div>
                        </div>
                    </div>

                    <div class="p-5 flex flex-col min-w-0">
                        <div class="text-xs uppercase font-semibold text-gray-900 mb-4 flex items-center flex-shrink-0">
                            <span class="w-2 h-2 rounded-full bg-blue-500 mr-2"></span> Source ( C )
                        </div>
                        <div id="p-src-{ID}" class="overflow-y-auto overflow-x-hidden custom-scrollbar max-h-[300px] w-full pr-1"></div>
                    </div>

                    <div class="p-5 flex flex-col min-w-0">
                        <div class="text-xs uppercase font-semibold text-gray-900 mb-4 flex items-center flex-shrink-0">
                            <span class="w-2 h-2 rounded-full bg-red-500 mr-2"></span> Destination ( D )
                        </div>
                        <div id="p-dst-{ID}" class="overflow-y-auto overflow-x-hidden custom-scrollbar max-h-[300px] w-full pr-1"></div>
                    </div>

                    <div class="p-5 space-y-6 flex flex-col min-w-0">
                        <div class="flex-shrink-0">
                            <div class="text-xs uppercase font-semibold text-gray-900 mb-3 flex items-center">
                                <span class="w-2 h-2 rounded-full bg-purple-500 mr-2"></span> Service
                            </div>
                            <div id="p-svc-{ID}" class="overflow-y-auto overflow-x-hidden custom-scrollbar max-h-[150px] w-full pr-1"></div>
                        </div>
                        <div class="flex-shrink-0 mt-4">
                            <div class="text-xs uppercase font-semibold text-gray-900 mb-2">Schedule</div>
                            <div id="p-sch-{ID}" class="font-medium text-gray-700 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200 inline-block break-all">always</div>
                        </div>
                    </div>

                    <div class="p-5 space-y-6 bg-slate-50/50 flex flex-col min-w-0">
                        <div class="flex-shrink-0">
                            <div class="text-xs uppercase font-semibold text-gray-900 mb-4 flex items-center">
                                <svg class="w-4 h-4 text-gray-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                                Security Profiles
                            </div>
                            <div id="p-sec-{ID}" class="space-y-2 overflow-y-auto overflow-x-hidden custom-scrollbar max-h-[120px] w-full pr-1"></div>
                        </div>
                        <div class="flex-shrink-0 mt-4">
                            <div class="text-xs uppercase font-semibold text-gray-900 mb-2">IP Pool</div>
                            <div id="p-pool-{ID}" class="overflow-y-auto overflow-x-hidden custom-scrollbar max-h-[100px] w-full pr-1"></div>
                        </div>
                    </div>
                </div>

                <div class="bg-[#F8FAFC] border-t border-gray-200 p-5 px-6 flex items-start space-x-4">
                    <div class="p-2 bg-white rounded-full shadow-sm border border-gray-200 text-green-500 mt-1 flex-shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    </div>
                    <div class="min-w-0">
                        <div class="text-xs font-semibold text-gray-700 mb-1 uppercase tracking-wider">Komentar / Catatan dari perangkat</div>
                        <div class="text-sm text-gray-600 font-medium leading-relaxed max-w-4xl break-words" id="p-comment-{ID}"></div>
                    </div>
                </div>
            </div>
        </div>
    </td>
</template>
