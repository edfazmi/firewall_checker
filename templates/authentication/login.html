{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIAKAF PTBA</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">

</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-[#28364B] to-[#E2E8F0] px-4 py-8">

    <div class="bg-white w-full max-w-md p-8 md:p-10 rounded-[2rem] shadow-2xl relative transition-all duration-300">

        <div class="flex justify-center items-center h-24 mb-6">
            <img src="{% static 'images/logo-ptba1.png' %}" alt="Logo Bukit Asam" class="w-[28rem] max-w-none object-contain pointer-events-none ml-6">
        </div>

        <div class="text-center mb-8">
            <h1 class="text-2xl font-extrabold text-[#28364B] tracking-wide">SIAKAF</h1>
            <p class="text-sm text-gray-600 mt-1">Sistem Informasi Analsisi Kebijakan Firewall</p>
        </div>

        <!-- Notifikasi Error dari Django -->
        {% if form.errors %}
            <div class="mb-5 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl text-center">
                Username atau password salah. Silakan coba lagi.
            </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <input type="text" name="username" placeholder="Username" required autocomplete="off"
                    class="w-full px-5 py-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-brand-blue focus:border-transparent transition-all text-sm text-gray-800 placeholder-gray-400 bg-gray-50 focus:bg-white">
            </div>

            <div class="relative">
                <input type="password" name="password" id="passwordInput" placeholder="Password" required
                    class="w-full px-5 py-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-brand-blue focus:border-transparent transition-all text-sm text-gray-800 placeholder-gray-400 bg-gray-50 focus:bg-white pr-12">
                
                <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-brand-blue focus:outline-none">
                    <svg id="eyeIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>

                    <svg id="eyeSlashIcon" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                    </svg>
                </button>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-brand-yellow hover:bg-brand-yellow_hover text-gray-900 font-bold rounded-full transition-colors shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-yellow mt-2 text-sm">
                Login
            </button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const passwordInput = document.getElementById('passwordInput');
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            const eyeIcon = document.getElementById('eyeIcon');
            const eyeSlashIcon = document.getElementById('eyeSlashIcon');

            function togglePassword() {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    eyeIcon.classList.add('hidden');
                    eyeSlashIcon.classList.remove('hidden');
                } else {
                    passwordInput.type = 'password';
                    eyeIcon.classList.remove('hidden');
                    eyeSlashIcon.classList.add('hidden');
                }
            }

            if (togglePasswordBtn) {
                togglePasswordBtn.addEventListener('click', togglePassword);
            }
        });
    </script>
</body>
</html>
